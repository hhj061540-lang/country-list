            { "name": "Botswana", "code": "BW", "flag": "https://flagcdn.com/w80/bw.png" },
            { "name": "Brazil", "code": "BR", "flag": "https://flagcdn.com/w80/br.png" },
            { "name": "Brunei", "code": "BN", "flag": "https://flagcdn.com/w80/bn.png" },
            { "name": "Bulgaria", "code": "BG", "flag": "https://flagcdn.com/w80/bg.png" },
            { "name": "Burkina Faso", "code": "BF", "flag": "https://flagcdn.com/w80/bf.png" },
