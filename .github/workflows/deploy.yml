name: Deploy Country List to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Public Directory and Generate Files
        run: |
          mkdir -p public/api

          # 1. Generate countries.json using a safe heredoc
          cat << 'EOF' > public/api/countries.json
